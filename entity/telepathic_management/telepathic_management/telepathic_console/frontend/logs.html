<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grace · System logs</title>
<link rel="icon" href="/static/assets/favicon.svg"><link rel="stylesheet" href="/static/logs.css">
<script src="/static/theme.js" defer></script><script src="/static/logs.js" defer></script>
</head>
<body>
<header><a href="/">← Chat with Grace</a><h1>System logs</h1><button id="themeToggle" type="button">◐ <span>Dark</span></button></header>
<main><section class="panel">
<div class="controls"><label>Level <select id="level"><option>ALL</option><option>DEBUG</option><option>INFO</option><option>WARN</option><option>ERROR</option><option>FATAL</option></select></label><label>Refresh <select id="refresh"><option value="0">Off</option><option value="5">5 seconds</option><option value="15" selected>15 seconds</option><option value="60">1 minute</option></select></label><button id="reload">Refresh now</button></div>
<p id="logPath" aria-live="polite">Loading logs…</p><p id="status" role="status" aria-live="polite"></p>
<div class="table-wrap"><table><thead><tr><th>Time</th><th>Level</th><th>Node</th><th>Message</th></tr></thead><tbody id="entries"></tbody></table></div>
</section></main>
</body></html>
