name: AIVA checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  aiva-python-and-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest dependencies
        run: python -m pip install pytest httpx
      - name: Check AIVA launch script syntax
        run: bash -n AIVA/launch.sh
      - name: Compile AIVA chat, logging, and signal packages
        run: python -m compileall -q AIVA/src/central_neural_system/aiva_chat/aiva_chat AIVA/src/central_neural_system/agi_logging/agi_logging AIVA/src/central_neural_system/cryptic_signal_core/aiva_cryptic_signal_core
      - name: Test AIVA chat, launch services, memory, and signal encoding
        env:
          PYTHONPATH: AIVA/src/central_neural_system/aiva_chat:AIVA/src/central_neural_system/cryptic_signal_core
        run: python -m pytest -q --ignore=AIVA/src/central_neural_system/aiva_chat/test/test_legacy_toc.py AIVA/src/central_neural_system/aiva_chat/test AIVA/src/central_neural_system/cryptic_signal_core/test

  aiva-ros-jazzy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Prepare Python test environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install pytest httpx websockets
      - name: Build AIVA chat, logging, and ROS message packages
        run: |
          source /opt/ros/jazzy/setup.bash
          cd AIVA
          colcon build --base-paths src/central_neural_system --packages-up-to aiva_chat agi_logging --cmake-args -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Run tests against the ROS graph
        env:
          AIVA_TEST_WITH_ROS: "1"
          PYTHONPATH: AIVA/src/central_neural_system/aiva_chat:AIVA/src/central_neural_system/cryptic_signal_core
          ROS_HOME: ${{ runner.temp }}/ros-home
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
        run: |
          source /opt/ros/jazzy/setup.bash
          source AIVA/install/setup.bash
          mapfile -t chat_tests < <(find AIVA/src/central_neural_system/aiva_chat/test -maxdepth 1 -type f -name 'test_*.py' ! -name 'test_legacy_toc.py' -print)
          mapfile -t signal_tests < <(find AIVA/src/central_neural_system/cryptic_signal_core/test -maxdepth 1 -type f -name 'test_*.py' -print)
          .venv/bin/python -m pytest -q "${chat_tests[@]}" "${signal_tests[@]}"
