name: AGi checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  shared-console-and-encoding:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AGi
    steps:
      - uses: actions/checkout@v4
        with:
          path: AGi
      - name: Check out shared Telepathy package
        uses: actions/checkout@v4
        with:
          repository: AGi-robot/telepathy
          path: AGi/AIVA/telepathy
      - name: Check out shared Cypher package
        uses: actions/checkout@v4
        with:
          repository: AGi-robot/cypher
          path: AGi/AIVA/cypher
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install pytest httpx fastapi uvicorn websockets PyYAML
      - name: Check AuRoRA launch script syntax
        run: bash -n AuRoRA/launch.sh
      - name: Verify the sibling Telepathy checkout link
        run: test "$(readlink -f AuRoRA/src/telepathic_management)" = "$(readlink -f AIVA/telepathy)"
      - name: Check console JavaScript and canvas behavior
        run: |
          node --check AuRoRA/src/telepathic_management/telepathic_management/telepathic_console/backend/static/drawing.js
          node --test AuRoRA/src/telepathic_management/test/test_canvas.cjs
      - name: Compile shared ROS packages
        run: python -m compileall -q AuRoRA/src/telepathic_management/telepathic_management AuRoRA/src/cryptic_signal_core/cryptic_signal_core AuRoRA/src/tms/tms
      - name: Import the shared console and test signal encoding
        env:
          PYTHONPATH: AuRoRA/src/telepathic_management:AuRoRA/src/cryptic_signal_core:AuRoRA/src/tms
        run: |
          python -c "from telepathic_management.telepathic_console.server import app; assert app.title == 'AGi Web Teleops Console'"
          python -m pytest -q AuRoRA/src/cryptic_signal_core/test/test_telepathic_encoding.py

  shared-ros-jazzy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AGi
    steps:
      - uses: actions/checkout@v4
        with:
          path: AGi
      - name: Check out shared Telepathy package
        uses: actions/checkout@v4
        with:
          repository: AGi-robot/telepathy
          path: AGi/AIVA/telepathy
      - name: Check out shared Cypher package
        uses: actions/checkout@v4
        with:
          repository: AGi-robot/cypher
          path: AGi/AIVA/cypher
          persist-credentials: false
      - name: Configure ROS apt source
        run: |
          set -euo pipefail
          source_version=1.3.0
          curl --fail --location --retry 3 --retry-delay 2 -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${source_version}/ros2-apt-source_${source_version}.noble_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Prepare Python test environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install pytest httpx websockets
      - name: Build shared ROS message and console packages
        run: |
          source /opt/ros/jazzy/setup.bash
          test "$(readlink -f AuRoRA/src/telepathic_management)" = "$(readlink -f AIVA/telepathy)"
          test "$(readlink -f AuRoRA/src/cryptic_signal_core)" = "$(readlink -f AIVA/cypher)"
          colcon build --base-paths AuRoRA/src/cryptic_signal_core AuRoRA/src/telepathic_management --packages-up-to telepathic_management --cmake-args -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Verify the built ROS packages
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 pkg prefix cryptic_signal_core
          ros2 pkg prefix telepathic_management
