; Grace's llama.cpp router presets: one llama-server process on port 8080
; serves chat/vision and embeddings, routing by the request's "model" name.
; Consumed by the agi-llm-router systemd user unit and AIVA/shell/launch.sh.
;
; Tuning baseline (2026-11-18, llama.cpp b12359). Keys map 1:1 to CLI flags:
;   flash-attn -> --flash-attn, n-gpu-layers -> --ngl, c -> --ctx-size,
;   b/ub -> --batch-size/--ubatch-size, spec-type -> --spec-type.
; VRAM budget on 2x RTX 3060 12 GB (~23 GB usable). The router keeps
; --models-max 2 and evicts LRU when a load would exceed the memory margin.

[*]
version = 1
; Required for the quantised KV caches below (q4_0/q8_0 fall back without it).
flash-attn = on
n-gpu-layers = 999
; Prefill batch. 512 is llama.cpp's default; 1024 is 1.5-2x faster on the
; long prompts IFEval and LongMemEval feed, for ~150 MB of compute buffer.
; b/ub must satisfy b >= ub; the embeddings model overrides both below.
ub = 1024

; Frontend chatbot model: always resident, handles chat turns.
; No mmproj -- vision requests route to swift15-qwen3.8-27b instead.
[ministral-3-8b-uncensored]
model = /home/oppa-ai/AGi/models/ministral3-8b/Ministral-3-8B-Uncensored.i1-Q4_K_M.gguf
; Q4 KV cache: full-attention 8B, so KV dominates -- halving it saves ~1.2 GB
; and lets the context cover Grace's full CORTICAL_CAPACITY (24576).
cache-type-k = q4_0
cache-type-v = q4_0
; 24K matches SCS.CORTICAL_CAPACITY in hrm.py -- the assembled memory
; context (system prompt + recall reserve + conversation) is budgeted for this.
c = 24576
; SOUL.md + user.md + the recall block are re-sent every turn. Reusing those
; prefix tokens avoids re-prefilling ~2-3k tokens per message.
cache-reuse = 256
; No speculative decoding here: n-gram lookup needs repetitive text and chat
; prose has almost none, so the verification cost is not repaid. The GGUF
; carries no MTP head either.
load-on-startup = true

[voyage-4-nano]
model = /home/oppa-ai/AGi/models/voyage-4-nano/voyage-4-nano-Q8_0.gguf
; CPU embedder: measured 0.03 s per query / 0.17 s per ~2k-token doc on this
; machine -- negligible next to LLM latency -- and it frees ~3.4 GB of VRAM.
; Bidirectional attention means batch must cover the longest input (GGUF card).
embeddings = true
pooling = mean
n-gpu-layers = 0
c = 8192
b = 8192
ub = 8192
load-on-startup = true

; Backend agentic/reasoning model: loaded on demand for tool calls,
; vision, and canvas work.
[swift15-qwen3.8-27b]
model = /home/oppa-ai/AGi/models/swift15-qwen3.8-27b/Swift-1.5-Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
; Vision projector for the Qwen3.8-27B vision tower (qwen3vl_merger).
mmproj = /home/oppa-ai/AGi/models/swift15-qwen3.8-27b/mmproj-Swift-1.5-Qwen3.8-27B-Uncensored-MTP-BF16.gguf
; The Qwen3.8 chat template carries tool calls, so llama.cpp needs --jinja.
jinja = on
; Match the tested geometry/vision recipe without unbounded thinking per pass.
reasoning-effort = medium
reasoning-budget = 2048
; q5_0 KV: good middle ground between q4_0 space savings and q8_0 precision,
; important because Swift holds 32K of context across 2 parallel slots.
cache-type-k = q5_0
cache-type-v = q5_0
c = 32768
; Two slots at 16K each (c is divided across slots). Canvas passes request up
; to 6144 output tokens on top of a ~3K prompt, so 8K per slot (parallel = 4)
; would starve the drawing passes; 2 is the floor that still batches.
parallel = 2
; The GGUF carries an MTP head (eh_proj + enorm + hnorm + shared_head), so
; self-speculative decoding cuts decode steps on every call. If a future build
; drops draft-mtp, delete this line -- the server refuses to load otherwise.
spec-type = draft-mtp
; JSON/canvas output repeats schema keys and earlier action objects, so n-gram
; lookup would also pay here; draft-mtp already covers the general case.
cache-reuse = 256
; Measured 2026-11-22: Swift-IQ3_S needs ~6216 MiB on CUDA0 + ~8802 MiB on
; CUDA1 (15.0 GB) at c=32768; Ministral needs ~3335 + ~3714 MiB (7.0 GB) at
; c=24576; voyage CPU needs ~576 MiB compute buffer. Total ~22.1 GB fits in
; 2x12GB only with --models-max 3 and --models-memory-margin 512 (usable
; ~23 GB). Keep all three resident: no 10-20 s swap, but almost no headroom --
; if you hit CUDA OOM under full concurrent load, drop swift c to 24576 first.
load-on-startup = true
;
; Canvas recipe (2026-11-22 geometry/vision update; see the benchmark README):
; AIVA uses the shared strict geometry schema: IDs, hex paints and shape coordinates,
; temperature 0, reasoning_effort=medium, and max_tokens=6144 per drawing pass.
; The server caps thinking at 2048 tokens, matching the local vision eval.
; Keep server reasoning enabled; do not set enable_thinking=false with grammar.
; launch.sh starts the server with --reasoning-effort medium. If using a
; systemd router unit, give its llama-server command the same flag.
; Without the schema IQ3_S can put colour prose in an ignored "prompt" field,
; leaving shapes to the renderer's warm fallback palette. The measured judge
; historical scores were sunflower 9/10 and lighthouse 9/10 (5/5 checks).

; Alternate smaller-quant candidate. The weights must be fully downloaded and
; installed at this path before selecting this alias in AIVA_DRAW_MODEL.
[swift15-qwen3.8-27b-iq3-xxs]
model = /home/oppa-ai/AGi/models/swift15-qwen3.8-27b/Swift-1.5-Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
mmproj = /home/oppa-ai/AGi/models/swift15-qwen3.8-27b/mmproj-Swift-1.5-Qwen3.8-27B-Uncensored-MTP-BF16.gguf
jinja = on
cache-type-k = q5_0
cache-type-v = q5_0
c = 32768
parallel = 2
spec-type = draft-mtp
cache-reuse = 256
load-on-startup = false
