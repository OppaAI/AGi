; Grace's llama.cpp router presets: one llama-server process on port 8080
; serves chat/vision and embeddings, routing by the request's "model" name.
; Consumed by the agi-llm-router systemd user unit and AIVA/launch.sh.

[*]
version = 1
flash-attn = on
n-gpu-layers = 999

[ministral-3-14b-instruct-2512]
model = /home/oppa-ai/AGi/models/ministral3/Ministral-3-14B-Instruct-2512-UD-Q4_K_XL.gguf
mmproj = /home/oppa-ai/AGi/models/ministral3/mmproj-BF16.gguf
; Q8 KV cache reduces the memory needed for the larger chat context.
cache-type-k = q8_0
cache-type-v = q8_0
; 32K is a measured step up from 25.6K; raise further only after checking
; the router's startup allocation and testing chat plus vision workloads.
c = 32768
load-on-startup = true

[voyage-4-nano]
model = /home/oppa-ai/AGi/models/voyage-4-nano/voyage-4-nano-Q8_0.gguf
; CPU embedder: measured 0.03 s per query / 0.17 s per ~2k-token doc on this
; machine -- negligible next to LLM latency -- and it frees ~3.4 GB of VRAM.
; Bidirectional attention means batch must cover the longest input (GGUF card).
embeddings = true
pooling = mean
n-gpu-layers = 0
c = 8192
b = 8192
ub = 8192
load-on-startup = true
