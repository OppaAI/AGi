; Grace's llama.cpp router presets: one llama-server process on port 8080
; serves chat/vision and embeddings, routing by the request's "model" name.
; Consumed by the agi-llm-router systemd user unit and AIVA/launch.sh.

[*]
version = 1
flash-attn = on
n-gpu-layers = 999

[ministral-3-14b-instruct-2512]
model = /home/oppa-ai/AGi/models/ministral3-14b/Ministral-3-14B-Instruct-2512-UD-Q4_K_XL.gguf
mmproj = /home/oppa-ai/AGi/models/ministral3-14b/mmproj-BF16.gguf
; Q8 KV cache reduces the memory needed for the larger chat context.
cache-type-k = q8_0
cache-type-v = q8_0
; 32K is a measured step up from 25.6K; raise further only after checking
; the router's startup allocation and testing chat plus vision workloads.
c = 32768
load-on-startup = true

[voyage-4-nano]
model = /home/oppa-ai/AGi/models/voyage-4-nano/voyage-4-nano-Q8_0.gguf
; CPU embedder: measured 0.03 s per query / 0.17 s per ~2k-token doc on this
; machine -- negligible next to LLM latency -- and it frees ~3.4 GB of VRAM.
; Bidirectional attention means batch must cover the longest input (GGUF card).
embeddings = true
pooling = mean
n-gpu-layers = 0
c = 8192
b = 8192
ub = 8192
load-on-startup = true

[swift15-qwen3.8-27b]
model = /home/oppa-ai/AGi/models/swift15-qwen3.8-27b/Swift-1.5-Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
; Vision projector for the Qwen3.8-27B vision tower (qwen3vl_merger). This is a
; DIFFERENT projector from ministral3-14b/mmproj-BF16.gguf (pixtral) -- the
; two are not interchangeable and must never be paired with the wrong model.
mmproj = /home/oppa-ai/AGi/models/swift15-qwen3.8-27b/mmproj-Swift-1.5-Qwen3.8-27B-Uncensored-MTP-BF16.gguf
; The Qwen3.8 chat template carries tool calls, so llama.cpp needs --jinja.
jinja = on
cache-type-k = q8_0
cache-type-v = q8_0
c = 32768
; 12.1 GB of weights: it will not sit in VRAM next to the 14B, so the router
; loads it on demand and swaps it out when the chat model is requested.
load-on-startup = false
;
; Canvas drawing recipe (2026-11-17 experiments, see
; diagnostic/scorecard/benchmarks/grace_canvas_eval/README.md "Local recipe"):
;   - add --reasoning-effort medium to this model's launch flags
;   - constrain canvas_draw arguments with the action JSON schema
;     (grammar/response_format), requiring kind + color + fill_color
;   - max_tokens >= 6144 for canvas turns
; Without the schema constraint IQ3_S writes colour prose into a "prompt"
; field and every shape falls back to the warm ensure_paint palette.
; Judge scores with the recipe: sunflower 9/10, lighthouse 9/10 (5/5 checks).
