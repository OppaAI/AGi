# ─────────────────────────────────────────────────────────────────────────────
# users.yaml — User Profiles
# ─────────────────────────────────────────────────────────────────────────────
# AuRoRA · Reticular Activating System (RAS)
#
# All user profiles known to GRACE.
# Each entry is loaded by CNC at boot by matching active_user id.
#
# Owner:   Admin (OppaAI)
# Runtime: ~/.agi/users.yaml
# ─────────────────────────────────────────────────────────────────────────────
users:
  oppaai:
    name:     "OppaAI"
    known_as: "Oppa"                        # what GRACE calls you
    location: "British Columbia, Canada"    # for context-aware responses
    preferences:
      response_verbosity:   "concise"       # concise | normal | verbose
      formality:            "casual"        # casual | formal | professional
      preferred_language:   "en"            # ISO 639-1 code — en | fr | zh | ja | es | ko
      emotional_tone:       "warm"          # warm | neutral | playful | empathetic | professional
      memory_salience_bias: 0.0             # per-user recall bias offset applied to relevance scores
