# ─────────────────────────────────────────────────────────────────────────────
# profile.yaml — USER Profile
# ─────────────────────────────────────────────────────────────────────────────
# AuRoRA · Homeostatic Regulation System (HRS)
#
# End-user identity and preferences injected into GRACE's context each session.
# This is the only file an end user should ever touch.
# No technical knowledge required.
#
# Owner:   End user
# Runtime: loaded by RAS at session start from ~/.agi/cns/profile.yaml
# ─────────────────────────────────────────────────────────────────────────────

user:
  name: "unknown"                 # user's full name
  known_as: "unknown"             # what GRACE calls you (nickname or first name)
  location: "unknown"             # user's location for context-aware responses
  notes:                          # anything GRACE should always know about you
    - ""
